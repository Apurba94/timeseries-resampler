[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-resampler"
version = "0.1.0"
description = "Resample timestamped measurements into fixed intervals with mean/min/max/sum aggregation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
timeseries-resampler = "timeseries_resampler.cli:main"

[tool.setuptools]
packages = ["timeseries_resampler"]
